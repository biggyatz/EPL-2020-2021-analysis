# Publishes the interactive dashboard (site/) plus the original knitted R
# dashboards (under r/) to the gh-pages branch on every push to
# main. GitHub Pages serves that branch (Settings -> Pages -> Deploy from a
# branch -> gh-pages / root).
name: Publish dashboards to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/r
          cp site/* _site/
          cp project.html big.html _site/r/
          touch _site/.nojekyll
      - name: Push to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish dashboards from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
